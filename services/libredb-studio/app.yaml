apiVersion: application.kubero.dev/v1alpha1
kind: KuberoApp
metadata:
    name: libredb-studio
    annotations:
        kubero.dev/template.architecture: '["amd64", "arm64"]'
        kubero.dev/template.description: "Modern, AI-powered open-source SQL IDE. Connect to and query PostgreSQL, MySQL, Oracle, SQL Server, SQLite, MongoDB, Redis, ClickHouse, DuckDB, Couchbase and more directly from your browser, with an optional AI assistant to help write and explain queries."
        kubero.dev/template.icon: "https://raw.githubusercontent.com/libredb/libredb-studio/main/public/logo.svg"
        kubero.dev/template.installation: "ADMIN_PASSWORD and JWT_SECRET are empty on purpose: the app generates both on first start and prints the admin password to the pod log once. JWT_SECRET also seals saved connection passwords, so a shared value is unsafe. USER_PASSWORD is optional. AUTH_COOKIE_SECURE is false because Kubero serves plain HTTP until you enable TLS. Data lives under /app/data."
        kubero.dev/template.links: '["https://libredb.org/"]'
        kubero.dev/template.screenshots: "[]"
        kubero.dev/template.source: "https://github.com/libredb/libredb-studio"
        kubero.dev/template.categories: '["database", "development", "utilities"]'
        kubero.dev/template.title: "LibreDB Studio"
        kubero.dev/template.website: "https://libredb.org"
    labels:
        manager: kubero
spec:
    name: libredb-studio
    deploymentstrategy: docker
    envVars:
    - name: ADMIN_EMAIL
      value: admin@libredb.org
    - name: ADMIN_PASSWORD
      value: ""
    - name: USER_EMAIL
      value: user@libredb.org
    - name: USER_PASSWORD
      value: ""
    - name: JWT_SECRET
      value: ""
    - name: STORAGE_PROVIDER
      value: sqlite
    - name: STORAGE_SQLITE_PATH
      value: /app/data/libredb-storage.db
    - name: AUTH_COOKIE_SECURE
      value: "false"
    extraVolumes:
    - accessModes:
      - ReadWriteOnce
      emptyDir: false
      mountPath: /app/data
      name: libredb-data
      size: 5Gi
    cronjobs: []
    addons: []
    web:
        replicaCount: 1
    worker:
        replicaCount: 0
    image:
        containerPort: 3000
        pullPolicy: Always
        repository: ghcr.io/libredb/libredb-studio
        tag: 0.18.1

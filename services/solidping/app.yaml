apiVersion: application.kubero.dev/v1alpha1
kind: KuberoApp
metadata:
  annotations:
    kubero.dev/template.architecture: '["arm64", "amd64"]'
    kubero.dev/template.description: 'Uptime and synthetic monitoring for HTTP, DNS, TCP, TLS, databases, heartbeats and browser checks, with status pages and alerts.'
    kubero.dev/template.icon: https://raw.githubusercontent.com/fclairamb/solidping/main/res/logo_256.png
    kubero.dev/template.installation: 'First login: admin@solidping.io / solidpass, organization
      "default". You are asked to set a new password right away. Data is stored in SQLite
      under /data. Set SP_BASE_URL to your public URL so links in notifications are right.
      Configuration: https://docs.solidping.io/configuration/'
    kubero.dev/template.links: '["https://docs.solidping.io"]'
    kubero.dev/template.screenshots: '["https://raw.githubusercontent.com/fclairamb/solidping/main/res/screenshots/checks-list.png",
      "https://raw.githubusercontent.com/fclairamb/solidping/main/res/screenshots/check-detail.png",
      "https://raw.githubusercontent.com/fclairamb/solidping/main/res/screenshots/check-form.png"]'
    kubero.dev/template.source: https://github.com/fclairamb/solidping
    kubero.dev/template.categories: '["monitoring"]'
    kubero.dev/template.title: SolidPing
    kubero.dev/template.website: https://www.solidping.io
  name: solidping
spec:
  addons: []
  cronjobs: []
  deploymentstrategy: docker
  envVars:
  - name: SP_NODE_NAME
    value: solidping
  extraVolumes:
  - accessModes:
    - ReadWriteOnce
    emptyDir: false
    mountPath: /data
    name: solidping-data
    size: 1Gi
  image:
    containerPort: '4000'
    repository: ghcr.io/fclairamb/solidping
    tag: latest
  name: solidping
  web:
    replicaCount: 1
  worker:
    replicaCount: 0
